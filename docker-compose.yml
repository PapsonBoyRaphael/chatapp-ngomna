version: "3.8"

services:
  # ============================================================================
  # CHAT-FILE-SERVICE - Cœur du système de messagerie
  # ============================================================================
  chat-file-service:
    build:
      context: ./chat-file-service
      dockerfile: Dockerfile
    container_name: chat-file-service
    ports:
      - "8003:8003"
    environment:
      # Node
      NODE_ENV: ${NODE_ENV:-development}

      # Service
      PORT: 8003
      CHAT_FILE_SERVICE_PORT: 8003

      # MongoDB
      MONGODB_URI: mongodb://mongodb:27017/chatdb
      MONGODB_REPLICA_SET: ${MONGODB_REPLICA_SET:-}

      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}

      # MinIO (S3-compatible)
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-chat-files}
      S3_REGION: ${S3_REGION:-us-east-1}

      # JWT
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-in-prod}
      JWT_EXPIRY: ${JWT_EXPIRY:-15m}
      JWT_REFRESH_EXPIRY: ${JWT_REFRESH_EXPIRY:-7d}

      # E2EE (Encryption)
      E2EE_ENABLED: ${E2EE_ENABLED:-false}
      E2EE_KEY_ALGORITHM: ${E2EE_KEY_ALGORITHM:-RSA}
      E2EE_KEY_SIZE: ${E2EE_KEY_SIZE:-2048}

      # Rate Limiting
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-900000}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-1000}
      RATE_LIMIT_AUTH_MAX: ${RATE_LIMIT_AUTH_MAX:-10}

      # Upload
      FILE_MAX_SIZE: ${FILE_MAX_SIZE:-104857600}
      CHUNK_SIZE: ${CHUNK_SIZE:-5242880}
      TEMP_DIR: /app/storage/temp

      # FFmpeg (Thumbnails)
      FFMPEG_PATH: /usr/bin/ffmpeg
      THUMBNAIL_MAX_SIZE: ${THUMBNAIL_MAX_SIZE:-200x200}

    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

    volumes:
      # Persistance des uploads
      - chat_uploads:/app/storage/uploads
      - chat_chunks:/app/storage/chunks
      - chat_temp:/app/storage/temp
      - chat_logs:/app/logs

    networks:
      - chat_network

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ============================================================================
  # MONGODB - Base de données NoSQL pour messages, conversations, fichiers
  # ============================================================================
  mongodb:
    image: mongo:6.0
    container_name: mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: chatdb
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-password}

    volumes:
      # Persistance des données
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
      # Initialisation (optionnel)
      - ./chat-file-service/scripts/mongo-init.js:/docker-entrypoint-initdb.d/init.js:ro

    networks:
      - chat_network

    restart: unless-stopped

    healthcheck:
      test: echo 'db.adminCommand("ping")' | mongosh --username ${MONGO_USER:-admin} --password ${MONGO_PASSWORD:-password} --authenticationDatabase admin
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    command: >
      mongod
      --replSet rs0
      --auth

  # ============================================================================
  # REDIS - Cache distribué, Streams, Pub/Sub pour la résilience
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    environment:
      # Configuration via le Dockerfile ou command
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}

    volumes:
      # Persistance RDB
      - redis_data:/data

    networks:
      - chat_network

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --requirepass ${REDIS_PASSWORD:-}

  # ============================================================================
  # MINIO - Stockage S3-compatible pour les fichiers (uploads, thumbnails)
  # ============================================================================
  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000" # API S3
      - "9001:9001" # Console Web
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
      MINIO_BROWSER: "on"

    volumes:
      # Persistance des fichiers
      - minio_data:/data

    networks:
      - chat_network

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 30s

    command: server /data --console-address ":9001"

    # (Optionnel) Créer le bucket au démarrage
    # Décommenter si vous avez un script d'init

# ============================================================================
# VOLUMES PERSISTANTS
# ============================================================================
volumes:
  # MongoDB
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local

  # Redis
  redis_data:
    driver: local

  # MinIO
  minio_data:
    driver: local

  # Chat-File-Service
  chat_uploads:
    driver: local
  chat_chunks:
    driver: local
  chat_temp:
    driver: local
  chat_logs:
    driver: local

# ============================================================================
# RÉSEAU INTERNE
# ============================================================================
networks:
  chat_network:
    driver: bridge
